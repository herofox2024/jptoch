name: Release QML V4

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, e.g. 4.1.1"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-qml-v4-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python -m pip install --upgrade pip
          pip install -r experimental\qml_v4\requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Resolve release version
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          $version = $version -replace '^refs/tags/', ''
          $version = $version -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main" -or $version -eq "master") {
            $version = python -c "from experimental.qml_v4.backend.app_info import APP_VERSION; print(APP_VERSION)"
          }
          if ($version -notmatch '^\d+\.\d+(\.\d+){0,2}$') {
            throw "Invalid release version: $version"
          }
          $fileVersion = $version
          while (($fileVersion.Split(".")).Count -lt 4) {
            $fileVersion = "$fileVersion.0"
          }
          "APP_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $appInfoPath = "experimental\qml_v4\backend\app_info.py"
          $appInfo = Get-Content $appInfoPath -Raw -Encoding UTF8
          $appInfo = $appInfo -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content $appInfoPath $appInfo -Encoding UTF8
          Write-Host "Resolved release version: $version ($fileVersion)"

      - name: Build PyInstaller onedir slim package
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python -m PyInstaller experimental\qml_v4\EPUBTranslator_onedir_slim.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $isccPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (Test-Path $candidate) {
              $isccPath = $candidate
            }
          }
          if (-not $isccPath) {
            throw "ISCC.exe not found after installing Inno Setup."
          }
          & $isccPath "/DMyAppVersion=$env:APP_BUILD_VERSION" "/DMyAppFileVersion=$env:APP_FILE_VERSION" "installer\EPUB日译中V4.0_slim.iss"

      - name: Package portable onedir
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $portableDirName = "AI日译中(EPUB)V${env:APP_BUILD_VERSION}_slim"
          $portableDir = Get-ChildItem dist -Directory | Where-Object { $_.Name -eq $portableDirName } | Select-Object -First 1
          if (-not $portableDir) {
            throw "Portable onedir output was not found under dist: $portableDirName"
          }
          Compress-Archive -Path (Join-Path $portableDir.FullName "*") -DestinationPath "dist\AI日译中(EPUB)V${env:APP_BUILD_VERSION}_slim_portable.zip" -Force

      - name: Verify build outputs
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $installer = Get-ChildItem dist\installer -Filter "*.exe" | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter "*.zip" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer exe was not generated."
          }
          if (-not $portable) {
            throw "Portable zip was not generated."
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Portable:  $($portable.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qml-v4-windows-build
          path: |
            dist/installer/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/*.zip
