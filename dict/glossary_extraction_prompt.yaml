# 术语提取规则模板 / Glossary Extraction Rules Template
# 使用方法：此文件定义术语提取的质量控制规则，拼接到系统提示词后
#
# 改造依据（实测数据，来自《黄金色的祈祷》):
#   原文出现 282 次的「コーちゃん」、201 次的「教子」、74 次的「ローラ」
#   全部未被提取；而只出现 1 次的动漫作品名反而被提取了。
#   旧规则的三个缺陷：
#     1. 「移除敬称后缀」被模型理解成「昵称不是专名」，导致假名昵称全丢
#     2. 「每批最多 5 条」让高频昵称挤不进返回结果
#     3. 规则只举例「汉字词」，模型因此偏好汉字名，忽略假名和外来语

glossary_extraction_prompt: |
  **术语提取规则 (GLOSSARY EXTRACTION RULES):**

  **目标语言: {{{target_lang}}}**

  # 提取任务
  提取需要在全书范围内保持译法一致的专有名词。判断标准是「会不会被反复提到」，
  而不是「看起来像不像人名」。

  # 最高优先级：按出现频率判断
  *   **反复出现的称呼必须提取**，哪怕它只是昵称、绰号、简称。
  *   日文小说里，一个人物常有多套叫法：正式姓名、姓氏、简称、昵称。
      这些都要提取，并且**译文必须互相呼应**（昵称要能看出本名的用字）。
  *   只出现一两次的作品名、书名、一次性的引用，优先级最低，可以不提取。

  # 假名与外来语人名（旧版最常漏掉的部分）
  *   **片假名昵称必须提取**：如「コーちゃん」「タカボウ」「ユタカ」「シンペー」。
      这类词看起来像语气词或普通词，但在小说里通常是高频人物称呼。
  *   **片假名外来语人名必须提取**：如「ローラ」「ジョン」「ティム」「エリオット」。
      不要因为它是片假名就当成普通外来语跳过。
  *   **平假名昵称也要提取**：如「まっちょ」这种由本名谐音变形的称呼。

  # 识别昵称的实用线索
  *   **与汉字姓名并列出现的片假名，几乎一定是该人物的昵称。**
      例：「小田切豊、コーちゃん、そして僕の三人」→ コーちゃん 是昵称，必须提取。
      例：「ユタカとコーちゃんの場合」→ ユタカ 也是人名。
  *   **能接「と」「は」「が」「に」等助词做主语/宾语的片假名词**，通常是人物。
  *   如果某个片假名词反复出现在「某人做了什么」的句位上，
      即使看不出是人名，也应该提取，并在 dst 里给出音译或意译。
  *   **本名和昵称要成对提取**：提取了「小田切豊」就该一并找他的昵称「ユタカ」；
      提取了「松元幸一」就该找「コーちゃん」。只收本名、漏收昵称，
      会造成译文里本名和昵称对不上。
  *   **【高频硬性要求】** 如果一个片假名词在整批文本里出现 3 次以上，
      且用法像人名（放在主语/宾语位置、或与其他名字并列），
      **必须提取**——哪怕你不确定它的确切含义。宁可译成音译，
      也不要让它每次被自由翻译成不同的中文。
      （典型漏收案例：「ユタカ」在全书中出现 76 次，却因为"看起来像普通词"被跳过。）

  # 昵称与敬称的处理（关键）
  *   **昵称要保留并翻译，不要删除**。原文用昵称的地方，译文也要用昵称。
  *   提取昵称时，在 dst 里给出与**本名用字**呼应的译法：
      - 「タカボウ」来自「石井孝義」的「孝」→ 译「孝哥」，不要音译成「高坊」
      - 「コーちゃん」来自「松元幸一」的「幸」→ 译「阿幸」或「小幸」
      - 「ミャア」来自「木村美夜」的「美夜」→ 译「小美夜」
  *   敬称后缀（さん/くん/ちゃん/様/先生）本身不单独提取，
      但**带后缀的整体昵称要提取**（「コーちゃん」是昵称，不是「コー」+敬称）。
  *   没有对应汉字的本名（如「ローラ」），按通行音译处理，全书统一。

  # 不该提取的
  *   普通名词、动词、形容词：❌「学校」「老师」「美味」「魔法」「剑」
  *   普通物种名：❌「猫」「狗」「狐狸」（除非是特定角色名）
  *   通用职业/身份：❌「社长」「部长」「老师」（除非被当作特定称呼）
  *   能直译且无歧义的普通组合词

  # 边界规范化
  *   不要把句首/句末助词（は、が、を、に、へ、で、の）并入术语
  *   不要把标点、括号、引号并入术语

  # 分类类别
  *   **Person**: 人物名、昵称、绰号、称呼
  *   **Location**: 地名（城市、商店、场所）
  *   **Org**: 组织/团体/乐队名
  *   **Item**: 命名物品、乐器型号、作品名
  *   **Skill**: 特殊招式/技能名
  *   **Creature**: 虚构生物/命名宠物/动物角色

  # 数量控制
  *   **优先返回高频词**：一批里如果有 20 个候选，先给最常见的那些。
  *   每批最多返回 12 条（旧版是 5 条，会导致高频昵称挤不进来）。
  *   同一原词若有多个明确译法，保留一个主译法，其余放入 aliases。
  *   质量优先于数量，但**不要因为「不确定是不是专名」就丢掉明显的人名**。
